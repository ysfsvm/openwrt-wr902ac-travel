name: release

# A tag v* builds the full image (kernel patches need the whole tree) and
# publishes it as a GitHub release.  workflow_dispatch builds it as an
# artifact only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f >/dev/null
          df -h /

      - name: build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: source cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('config/openwrt-version', 'config/diffconfig') }}
          restore-keys: dl-

      - name: build
        run: scripts/build.sh openwrt

      - name: collect
        run: |
          mkdir release
          cd openwrt/bin/targets/ramips/mt76x8
          cp -- *tl-wr902ac-v3-squashfs-sysupgrade.bin *tl-wr902ac-v3-squashfs-tftp-recovery.bin \
            *tl-wr902ac-v3.manifest \
            config.buildinfo feeds.buildinfo version.buildinfo "$GITHUB_WORKSPACE/release/"
          cd "$GITHUB_WORKSPACE/release"
          sha256sum -- * > sha256sums
          cat sha256sums

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.bin

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: release/

      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves the tag pointing at the commit; fetch the tag
          # object for its message, without the signature
          git fetch --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > notes
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes
